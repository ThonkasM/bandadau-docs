openapi: 3.1.0
info:
  title: Bandada U — ticketing-service (estadísticas internas)
  version: 1.1.0
  summary: Lector interno de estadísticas y de validaciones de tickets para las herramientas MCP y el panel.
  description: |
    Complemento **interno** de `ticketing-service.yaml` (mismo servicio, `ticketing-service`, NestJS 11, Clean Architecture,
    DynamoDB `bandada-ticketing`). Vive en un archivo aparte para no mezclar este contrato con los cambios pendientes de
    `ticketing-service.yaml`; al consolidarse se podrá fusionar en él sin cambiar rutas ni `operationId`.

    - Solo red interna con `serviceAuth` (`typ=service`, `aud=bandada-internal`); exige el scope `internal:read` (D-7).
    - Solo cifras agregadas e identificadores de evento: nunca `userId`, QR ni datos personales.
    - La lectura recorre la tabla con un `Scan` filtrado y acotado (tope de 20 000 tickets); si se alcanza el tope la respuesta
      lleva `truncated: true`. Es una consulta administrativa de baja frecuencia (agente de reportes), no del camino crítico.
    - Errores RFC 9457 con `code` estable (`INVALID_RANGE` en `400`).

    ## Changelog
    - 1.1.0 (2026-11-09): `GET /internal/v1/validations` (`listTicketValidations`): quién escaneó cada entrada y cuándo (`usedBy`/`usedAt`), para el reporte de asistencia del panel. Incluye identificadores de usuario (`attendeeId`, `validatedBy`): solo ADMIN a través del gateway, nunca MCP.
    - 1.0.0 (2026-10-16): `GET /internal/v1/stats/tickets` (`getTicketStats`) para la herramienta MCP `get_ticket_stats` y el criterio `ATTENDANCE` de `get_event_ranking`.
  contact:
    name: Grupo 24 — Ingeniería de Software II
servers:
  - url: http://ticketing-service:7006
    description: Red interna (Docker/VPC)
tags:
  - name: internal
    description: Endpoints internos (`/internal/v1`), solo con token de servicio.
paths:
  /internal/v1/stats/tickets:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [internal]
      operationId: getTicketStats
      summary: Estadísticas agregadas de tickets (interno)
      description: |
        Cuenta los tickets **emitidos** (`issuedAt`) entre `from` y `to` (UTC, inclusivo) y su estado actual:
        `issued` (todos), `used` (`USED`) y `voided` (`VOIDED`); `usageRate = used / issued` (0 si `issued = 0`, 4 decimales,
        nunca > 1). `byEvent` desglosa por evento (título tomado del propio ticket) ordenado por `used` desc, luego `issued`
        desc y `eventId`, con un máximo de 50 filas. `eventId` limita a un evento. Rango máximo 366 días; `from` ≤ `to`,
        si no → `400` `INVALID_RANGE`. Exige el scope `internal:read`.
      security:
        - serviceAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inicio inclusivo (UTC), `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Fin inclusivo (UTC), `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: eventId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Estadísticas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketStats'
              examples:
                rango:
                  value:
                    from: '2026-10-01'
                    to: '2026-10-16'
                    issued: 18
                    used: 5
                    voided: 2
                    usageRate: 0.2778
                    truncated: false
                    byEvent:
                      - eventId: 0192f3c1-2d3e-7f41-b263-748596a7b8c9
                        title: Hackathon UMSA
                        issued: 9
                        used: 4
                        voided: 1
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
  /internal/v1/validations:
    parameters:
      - $ref: './shared/components.yaml#/components/parameters/AcceptLanguage'
      - $ref: './shared/components.yaml#/components/parameters/CorrelationId'
    get:
      tags: [internal]
      operationId: listTicketValidations
      summary: Entradas validadas en la puerta (interno)
      description: |
        Lista las entradas **validadas** (`USED`) cuya validación (`usedAt`) cae entre `from` y `to` (UTC, inclusivo), de la
        más reciente a la más antigua: qué evento, de quién era la entrada (`attendeeId`) y quién la escaneó (`validatedBy`,
        el `usedBy` del ticket: un `ORGANIZER` del evento o un `ADMIN`). `eventId` limita a un evento. `limit` por defecto 100,
        máximo 500. Rango máximo 366 días; `from` ≤ `to`, si no → `400` `INVALID_RANGE`. La lectura es un `Scan` filtrado y
        acotado (tope de 20 000 tickets); si se alcanza el tope, `truncated: true`. Exige el scope `internal:read`.
        Los nombres no vienen aquí: el gateway los resuelve con identity.
      security:
        - serviceAuth: []
      parameters:
        - name: from
          in: query
          required: true
          description: Inicio inclusivo (UTC), `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: Fin inclusivo (UTC), `YYYY-MM-DD`.
          schema:
            type: string
            format: date
        - name: eventId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Validaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketValidationList'
              examples:
                rango:
                  value:
                    from: '2026-11-01'
                    to: '2026-11-09'
                    truncated: false
                    items:
                      - ticketId: 0192f3c1-2d3e-7f41-b263-748596a7b8c1
                        eventId: 0192f3c1-2d3e-7f41-b263-748596a7b8c9
                        eventTitle: Hackathon Bandada U
                        attendeeId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                        validatedBy: 0192f1a2-4c5d-7e6f-9a01-8293a4b5c6d7
                        validatedAt: '2026-11-08T22:45:00Z'
        '400':
          $ref: './shared/components.yaml#/components/responses/BadRequest'
        '401':
          $ref: './shared/components.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './shared/components.yaml#/components/responses/Forbidden'
components:
  schemas:
    TicketValidationList:
      type: object
      required: [from, to, truncated, items]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        truncated:
          type: boolean
          description: '`true` si se alcanzó el tope de tickets analizados (lista parcial).'
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/TicketValidation'
    TicketValidation:
      type: object
      required: [ticketId, eventId, eventTitle, attendeeId, validatedBy, validatedAt]
      properties:
        ticketId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventTitle:
          type: string
        attendeeId:
          type: string
          format: uuid
          description: Dueño de la entrada.
        validatedBy:
          type: string
          format: uuid
          description: Quién escaneó la entrada (`usedBy`).
        validatedAt:
          type: string
          format: date-time
    TicketStats:
      type: object
      required: [from, to, issued, used, voided, usageRate, truncated, byEvent]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        issued:
          type: integer
        used:
          type: integer
        voided:
          type: integer
        usageRate:
          type: number
          minimum: 0
          maximum: 1
        truncated:
          type: boolean
          description: '`true` si se alcanzó el tope de tickets analizados (cifras parciales).'
        byEvent:
          type: array
          maxItems: 50
          items:
            type: object
            required: [eventId, title, issued, used, voided]
            properties:
              eventId:
                type: string
                format: uuid
              title:
                type: string
              issued:
                type: integer
              used:
                type: integer
              voided:
                type: integer
  securitySchemes:
    serviceAuth:
      $ref: './shared/components.yaml#/components/securitySchemes/serviceAuth'
