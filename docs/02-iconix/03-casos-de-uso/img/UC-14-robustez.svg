<path d="M 0 46 L 26 20 L 26 46 Z" fill="#e6e6e6" stroke="#222" stroke-width="1.4" />
<text x="16" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333">CURSO BÁSICO:</text>
<text x="16" y="85" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">El portero escanea el QR de la</text>
<text x="16" y="102" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">entrada. La app pre-verifica la</text>
<text x="16" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">firma ES256 con la clave pública</text>
<text x="16" y="136" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">en caché y envía validateTicket</text>
<text x="16" y="153" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">con una Idempotency-Key.</text>
<text x="16" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333"></text>
<text x="16" y="187" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">El servicio autoriza al organizador,</text>
<text x="16" y="204" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">verifica la firma y marca el ticket</text>
<text x="16" y="221" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">USED con una escritura condicional</text>
<text x="16" y="238" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">en DynamoDB. La app muestra</text>
<text x="16" y="255" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">«Entrada válida» y el outbox publica</text>
<text x="16" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">ticket.used.v1.</text>
<text x="16" y="306" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#333">CURSOS ALTERNOS:</text>
<text x="16" y="323" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">Sin red: la app verifica la firma</text>
<text x="16" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">localmente, registra el escaneo en</text>
<text x="16" y="357" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">la cola offline y muestra «Válida</text>
<text x="16" y="374" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">(pendiente)». Al volver la red, la</text>
<text x="16" y="391" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">cola se drena con la misma clave.</text>
<text x="16" y="408" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333"></text>
<text x="16" y="425" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">QR inválido, de otro evento, ya</text>
<text x="16" y="442" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">usado o portero no autorizado:</text>
<text x="16" y="459" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">pantalla de error; el ticket no</text>
<text x="16" y="476" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">cambia. Dos puertas a la vez: la</text>
<text x="16" y="493" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">escritura condicional deja</text>
<text x="16" y="510" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#333">exactamente un USED.</text>
<text x="16" y="545" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#555">El QR pasa de la pantalla del estudiante a la</text>
<text x="16" y="560" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#555">del portero por lectura óptica; no es un</text>
<text x="16" y="575" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-style="italic" fill="#555">mensaje de software entre ambas.</text>
